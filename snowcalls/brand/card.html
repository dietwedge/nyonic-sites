<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SnowCalls brand card</title>
<style>
  :root{
    --ink:#0D1830;       /* midnight — deliberately bluer than PestCalls' slate-teal */
    --ice:#8FD8F2;       /* pale ice — accent on dark */
    --ice-mid:#5FC0E4;   /* wordmark "Calls" on dark */
    --cream:#F4F2EC;
    --orange:#FF6B1A;    /* family CTA — reads as a plow beacon here */
    --muted:#7C8BA6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink)}
  .card{
    width:1120px;height:700px;background:var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .lockup{display:flex;align-items:center;gap:22px}
  .lockup svg{width:118px;height:118px;flex:none}
  .word{font-size:104px;font-weight:700;letter-spacing:-.035em;line-height:1;color:var(--cream);white-space:nowrap}
  .word b{color:var(--ice-mid);font-weight:700}
  .rule{width:64px;height:3px;background:var(--orange);margin:46px 0 34px;border-radius:2px}
  .tag{font-family:Georgia,"Times New Roman",serif;font-size:40px;color:var(--cream);letter-spacing:-.01em}
  .tag i{color:var(--ice-mid);font-style:italic}
  .sub{margin-top:26px;font-size:18px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:600}
</style>
</head>
<body>
<div class="card">

  <div class="lockup">
    <!-- Handset is the family constant. TreeCalls sprouts a leaf, PestCalls carries
         a shield, PizzaCalls a slice, SnowCalls a flake. Three crossing arms with
         short chevrons — enough to read as a snowflake, few enough to survive 16px. -->
    <svg viewBox="0 0 64 64" role="img" aria-label="SnowCalls">
      <g stroke="#8FD8F2" stroke-width="3.7" stroke-linecap="round" fill="none">
        <path d="M44 4.5 v31 M30.6 12.25 L57.4 27.75 M30.6 27.75 L57.4 12.25"/>
        <path d="M40 8.6 L44 12 L48 8.6 M40 31.4 L44 28 L48 31.4"/>
        <path d="M33.2 16.6 L34.9 21.5 L30 22.3 M54.8 23.4 L53.1 18.5 L58 17.7"/>
        <path d="M30 17.7 L34.9 18.5 L33.2 23.4 M58 22.3 L53.1 21.5 L54.8 16.6"/>
      </g>
      <path d="M16.5 20c-2.4 0-4.6 2.2-4.6 4.6 0 15.6 13.4 29 29 29 2.4 0 4.6-2.2 4.6-4.6v-5.6l-10.1-3.4-4.5 4.5c-5.6-3.4-10.1-7.9-13.5-13.5l4.5-4.5z"
            fill="#F4F2EC"/>
    </svg>
    <div class="word">Snow<b>Calls</b></div>
  </div>

  <div class="rule"></div>
  <div class="tag">Every missed call, <i>answered.</i></div>
  <div class="sub">24/7 Storm Line for Snow Removal</div>

</div>
</body>
</html>
