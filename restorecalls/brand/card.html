<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PestCalls brand card</title>
<style>
  :root{
    --ink:#0E2730;      /* slate-teal ground */
    --teal:#14A3B8;     /* the accent — the shield */
    --mint:#5FC5D6;     /* "Calls" in the wordmark on dark */
    --cream:#F4F2EC;    /* handset, "Pest" */
    --orange:#FF6B1A;   /* the rule — CTA colour, used here as a divider only */
    --muted:#7E9AA3;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink)}
  .card{
    width:1120px;height:700px;background:var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .lockup{display:flex;align-items:center;gap:22px}
  .lockup svg{width:118px;height:118px;flex:none}
  .word{
    font-size:104px;font-weight:700;letter-spacing:-.035em;line-height:1;
    color:var(--cream);white-space:nowrap
  }
  .word b{color:var(--mint);font-weight:700}
  .rule{width:64px;height:3px;background:var(--orange);margin:46px 0 34px;border-radius:2px}
  .tag{
    font-family:Georgia,"Times New Roman",serif;font-size:40px;color:var(--cream);
    letter-spacing:-.01em
  }
  .tag i{color:var(--mint);font-style:italic}
  .sub{
    margin-top:26px;font-size:18px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--muted);font-weight:600
  }
</style>
</head>
<body>
<div class="card">

  <div class="lockup">
    <!-- The mark: the handset is the family device (it is "Calls"); the trade
         symbol swaps. TreeCalls sprouts a leaf. PestCalls carries a shield —
         pest control sells protection of the house, not the insect. -->
    <svg viewBox="0 0 64 64" role="img" aria-label="PestCalls">
      <!-- Shield, upper right, mirroring where the TreeCalls leaf sits. It holds a
           check, not a cross: a vertical and a horizontal stroke inside a shield
           reads as a crucifix, which is not what this brand is selling. The check
           also carries the tagline — the call is handled. -->
      <path d="M44 5 L56.5 9.6 v10.6 c0 9.4-6.3 15.6-12.5 18.1 -6.2-2.5-12.5-8.7-12.5-18.1 v-10.6 z"
            fill="#14A3B8"/>
      <path d="M38.4 20.6 l4.1 4.1 7.4-7.8" fill="none" stroke="#0E2730"
            stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- handset -->
      <path d="M16.5 20c-2.4 0-4.6 2.2-4.6 4.6 0 15.6 13.4 29 29 29 2.4 0 4.6-2.2 4.6-4.6v-5.6l-10.1-3.4-4.5 4.5c-5.6-3.4-10.1-7.9-13.5-13.5l4.5-4.5z"
            fill="#F4F2EC"/>
    </svg>
    <div class="word">Pest<b>Calls</b></div>
  </div>

  <div class="rule"></div>
  <div class="tag">Every missed call, <i>answered.</i></div>
  <div class="sub">24/7 Lead Rescue for Pest Control</div>

</div>
</body>
</html>
